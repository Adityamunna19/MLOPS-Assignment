name: Tourism MLOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-prepare-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Register and validate dataset
        run: python model_building/data_register.py
        working-directory: tourism_project
      - name: Prepare train and test data
        run: python model_building/prep.py
        working-directory: tourism_project
      - name: Train and evaluate model
        run: python model_building/train.py
        working-directory: tourism_project
      - name: Upload train/test splits, metrics, and model
        uses: actions/upload-artifact@v4
        with:
          name: tourism-model-artifacts
          path: |
            tourism_project/artifacts/
            tourism_project/deployment/wellness_propensity_model.joblib
      - name: Commit refreshed deployment model
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tourism_project/deployment/wellness_propensity_model.joblib
          git diff --cached --quiet || git commit -m 'chore: refresh deployed model'
          git push
